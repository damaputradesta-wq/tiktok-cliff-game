<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raja Tebing TikTok Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background: #0f172a; color: #fff; overflow: hidden; display: flex; justify-content: center; height: 100vh; }
    #game-wrap { position: relative; width: 100%; max-width: 480px; height: 100vh; background: linear-gradient(180deg, #020617 0%, #1e293b 50%, #334155 100%); overflow: hidden; border-left: 3px solid #475569; border-right: 3px solid #475569; }
    canvas { width: 100%; height: 100%; display: block; }
    .hud { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; pointer-events: none; }
    .box { background: rgba(15, 23, 42, 0.85); border: 2px solid #f59e0b; border-radius: 12px; padding: 8px 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .height-text { font-size: 26px; font-weight: 900; color: #38bdf8; }
    .sub-text { font-size: 11px; color: #cbd5e1; }
    .rules { position: absolute; top: 95px; left: 12px; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 10px; font-size: 12px; line-height: 1.7; border-left: 4px solid #ec4899; pointer-events: none; }
    #banner { position: absolute; top: 36%; left: 50%; transform: translate(-50%, -50%) scale(0); background: rgba(220, 38, 38, 0.95); border: 3px solid #fde047; padding: 12px 20px; border-radius: 16px; text-align: center; font-weight: 900; transition: 0.25s; pointer-events: none; z-index: 10; width: 85%; }
    #banner.show { transform: translate(-50%, -50%) scale(1); }
    .sim-bar { position: absolute; bottom: 12px; left: 12px; right: 12px; display: flex; gap: 6px; z-index: 20; }
    .sim-btn { flex: 1; padding: 10px 6px; border: none; border-radius: 8px; font-weight: 800; font-size: 12px; cursor: pointer; color: #fff; }
    .btn-boost { background: #10b981; }
    .btn-rock { background: #f59e0b; }
    .btn-meteor { background: #ef4444; }
  </style>
</head>
<body>
  <div id="game-wrap">
    <canvas id="canvas"></canvas>
    <div class="hud">
      <div class="box">
        <div class="sub-text">KETINGGIAN (TARGET 1000m)</div>
        <div class="height-text" id="meter">0 m</div>
        <div class="sub-text" id="status">Mode Siap</div>
      </div>
      <div class="box" style="text-align:right">
        <div class="sub-text">MENANG: <span id="wins" style="color:#4ade80;font-weight:bold">0</span>x</div>
        <div class="sub-text" style="color:#fbbf24;font-weight:bold;margin-top:4px">TOP SULTAN TROLL:</div>
        <div id="top-troll" style="font-size:13px;font-weight:900;color:#f87171">-</div>
      </div>
    </div>
    <div class="rules">
      &#10084;&#65039; <b>Tap-Tap / Komen</b> = Jetpack Naik (+15m)<br/>
      &#127801; <b>Mawar / Gift Kecil</b> = Lempar Batu (-45m)<br/>
      &#127849; <b>Donat / Gift 10+ Koin</b> = METEOR (-180m)
    </div>
    <div id="banner"></div>
    <div class="sim-bar" id="sim-bar">
      <button class="sim-btn btn-boost" onclick="triggerBoost('Penonton_Baik', 20)">&#9889; Tes Tap-Tap</button>
      <button class="sim-btn btn-rock" onclick="triggerAttack('boulder', 'Sultan_Iseng', 'Mawar', 45)">&#129704; Tes Mawar</button>
      <button class="sim-btn btn-meteor" onclick="triggerAttack('meteor', 'Raja_Troll99', 'Donat', 180)">&#9732;&#65039; Tes Meteor</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 480;
    canvas.height = 854;

    const params = new URLSearchParams(window.location.search);
    const tiktokUser = params.get('user');
    if (params.get('hidebtn') === '1') document.getElementById('sim-bar').style.display = 'none';

    let height = 50, targetHeight = 50, wins = 0, shake = 0;
    const hazards = [];
    const trolls = {};

    function showBanner(html, bg) {
      const b = document.getElementById('banner');
      b.style.background = bg || 'rgba(220,38,38,0.95)';
      b.innerHTML = html;
      b.classList.add('show');
      setTimeout(() => b.classList.remove('show'), 2200);
    }

    function triggerBoost(user, power) {
      targetHeight = Math.min(1000, targetHeight + power);
      showBanner('&#128640; @' + user + '<br/><span style="font-size:14px">KASIH JETPACK +' + power + 'm!</span>', 'rgba(16,185,129,0.92)');
    }

    function triggerAttack(type, user, giftName, power) {
      trolls[user] = (trolls[user] || 0) + power;
      const top = Object.entries(trolls).sort((a,b) => b[1] - a[1])[0];
      if (top) document.getElementById('top-troll').innerText = '@' + top[0] + ' (-' + top[1] + 'm)';

      hazards.push({
        x: 240 + (Math.random() * 60 - 30),
        y: -60,
        r: type === 'meteor' ? 58 : 34,
        vy: type === 'meteor' ? 14 : 10,
        type: type, user: user, power: power, hit: false
      });

      const title = type === 'meteor' ? '&#9732;&#65039; METEOR SULTAN!' : '&#129704; SERANGAN BATU!';
      showBanner(title + '<br/>@' + user + ' kirim ' + giftName + ' (-' + power + 'm)');
    }

    if (typeof io !== 'undefined') {
      const socket = io();
      if (tiktokUser) {
        socket.emit('join-live', tiktokUser);
        socket.on('status', (msg) => document.getElementById('status').innerText = msg);
        socket.on('game-event', (ev) => {
          if (ev.type === 'boost') triggerBoost(ev.user, ev.power);
          else triggerAttack(ev.type, ev.user, ev.giftName, ev.power);
        });
      }
    }

    function loop() {
      targetHeight += 0.12;
      if (targetHeight >= 1000) {
        wins++;
        document.getElementById('wins').innerText = wins;
        showBanner('&#128081; PUNCAK 1000m TERCAPAI!<br/>Mulai Ronde Baru!', 'rgba(234,179,8,0.95)');
        targetHeight = 20;
        height = 20;
      }
      height += (targetHeight - height) * 0.08;
      document.getElementById('meter').innerText = Math.floor(height) + ' m';

      ctx.save();
      if (shake > 0) {
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
        shake *= 0.9;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#334155';
      ctx.fillRect(150, 0, 180, canvas.height);
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 4;
      const offset = (height * 12) % 80;
      for (let y = -80; y < canvas.height + 80; y += 80) {
        ctx.beginPath();
        ctx.moveTo(155, y + offset);
        ctx.lineTo(325, y + offset);
        ctx.stroke();
      }

      const climberY = 520;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(240, climberY, 26, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#fff';
      ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PEMANJAT', 240, climberY + 45);

      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.y += h.vy;
        ctx.fillStyle = h.type === 'meteor' ? '#ef4444' : '#f59e0b';
        ctx.beginPath();
        ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fde047';
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 12px sans-serif';
        ctx.fillText('@' + h.user, h.x, h.y + 4);

        if (!h.hit && h.y + h.r >= climberY - 24) {
          h.hit = true;
          targetHeight = Math.max(0, targetHeight - h.power);
          shake = h.type === 'meteor' ? 28 : 12;
        }
        if (h.y > canvas.height + 100) hazards.splice(i, 1);
      }

      ctx.restore();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
